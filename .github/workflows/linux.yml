name: Build Linux Release

on:
  push:
    branches: [main]
    paths:
      - "linux/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Linux client
        run: |
          mkdir -p dist
          cp linux/crtunnel.py linux/install.sh dist/
          chmod +x dist/crtunnel.py dist/install.sh
          cd dist
          tar -czf ../CRTunnel_Linux.tar.gz crtunnel.py install.sh
          cd ..
          zip -r CRTunnel_Linux.zip dist/
          ls -la

      - name: Create or update Linux Verison release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/linux" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          if [ -n "$EXISTING_ID" ]; then
            curl -s -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$EXISTING_ID"
          fi
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"tag_name":"linux","name":"Linux Verison","body":"CR Tunnel Linux desktop client (GTK3 + Xray-core). Install: download, extract, then run install.sh.","draft":false,"prerelease":false}' \
            "https://api.github.com/repos/${{ github.repository }}/releases"

      - name: Upload assets to Linux Verison release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/linux" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          for file in CRTunnel_Linux.tar.gz CRTunnel_Linux.zip; do
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$file"
            echo ""
          done